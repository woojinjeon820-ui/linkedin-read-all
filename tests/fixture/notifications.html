<!doctype html>
<!-- Mirrors the structure of linkedin.com/notifications as observed on 2026-11-11:
     hashed class names, each card wrapped in several plain divs, one
     "More options" button per card, and a full-card link last in the card. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notifications fixture</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #f4f2ee; color: #1d2226; }
      main { max-width: 560px; margin: 24px auto; height: 90vh; overflow-y: scroll; }
      .card { background: #fff; padding: 12px 56px 12px 16px; border-bottom: 1px solid #e8e8e8; display: flex; gap: 12px; position: relative; }
      .avatar { width: 48px; height: 48px; border-radius: 50%; background: #c7d7e8; flex: none; }
      .menu { position: absolute; right: 12px; top: 10px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; font-size: 18px; }
      .overlay { position: absolute; inset: 0; z-index: 1; }
      /* LinkedIn's "new" markers: a tinted box and a small blue dot in the left margin. */
      .card.new { background: rgba(10, 102, 194, 0.08); }
      .card.new::before { content: ''; position: absolute; left: 6px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #0a66c2; }
      .dot { position: absolute; left: 6px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #0a66c2; }
      .pills { padding: 12px 16px; background: #fff; margin-bottom: 8px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <main>
      <div aria-label="Primary content" role="region">
        <div class="pills"><input type="checkbox" checked hidden /><label>All</label> <label>Jobs</label> <label>My posts</label> <label>Mentions</label></div>
        <div id="list"></div>
      </div>
    </main>
    <script>
      const items = [
        ['/posts/me_share-1/?trk=a', 'Jordan Lee and 20 others reacted to your post.'],
        ['/pulse/global-growth/?trk=b', 'New from Acme Capital in Acme Weekly'],
        ['/notifications/aggregate/?title=Events&notificationType=EVENT_WEEKLY&trk=c', 'GitHub and others you follow created 4 events this week.'],
        ['/analytics/post-summary/urn:li:activity:1/', 'Your post got 938 impressions and drove 51 profile viewers.'],
        ['/jobs/search-results/?keywords=intern&f_TPR=a123-&geoId=1', 'Intern: new opportunities in Seoul'],
        ['/jobs/search-results/?keywords=analyst&f_TPR=a124-&geoId=2', 'Analyst: new opportunities in Singapore'],
        ['/posts/club_share-2/', 'Sam Rivera and 2 other connections reacted to a post'],
        ['/me/profile-views/', '20 people viewed your profile'],
      ];
      const list = document.getElementById('list');
      // Every other card is "new": some draw the dot as an element, some as ::before.
      let n = 0;
      const add = ([href, text]) => {
        const w = document.createElement('div');
        const i = n++;
        const dot = i % 4 === 1 ? '<span class="dot"></span>' : '';
        w.innerHTML = `<div><div class="card${i % 4 === 3 ? ' new' : ''}">${dot}<div class="avatar"></div><div><div>${text}</div><small>1h</small></div>
          <div><button class="menu" aria-label="More options" aria-expanded="false">⋯</button></div>
          <a class="overlay" href="${href}" aria-label="${text}"></a></div></div>`;
        list.appendChild(w);
      };
      items.forEach(add);
      // Lazy-load older items when scrolled to the bottom, like LinkedIn.
      document.querySelector('main').addEventListener('scroll', (e) => {
        const m = e.target;
        if (m.scrollTop + m.clientHeight >= m.scrollHeight - 4 && !window.__more) {
          window.__more = true;
          [['/posts/old-1/', 'Old: Alex commented on your post'], ['/posts/old-2/', 'Old: Sam mentioned you']].forEach(add);
        }
      });
      document.addEventListener('click', (e) => { if (e.target.closest('a')) { e.preventDefault(); window.__navigatedTo = e.target.closest('a').getAttribute('href'); } });
    </script>
  </body>
</html>
