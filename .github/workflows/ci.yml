name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: for f in extension/src/*.js extension/popup/popup.js; do node --check "$f"; done
      - run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"
      - run: bash -n install.sh

  # Runs the Windows installer end to end against a real Chrome with a throwaway profile:
  # download, Developer mode, Load unpacked, folder picker. Then again to check the update path.
  windows-install:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, brave]
    steps:
      - uses: actions/checkout@v4
      - name: Install Brave
        if: matrix.browser == 'brave'
        shell: powershell
        run: choco install brave -y --no-progress
      - name: Parse install.ps1
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
      - name: First install loads the extension
        shell: powershell
        env:
          LNRA_DIR: ${{ runner.temp }}\LinkedIn-Read-All
          LNRA_USER_DATA_DIR: ${{ runner.temp }}\browser-profile
          LNRA_BROWSER: ${{ matrix.browser }}
          LNRA_NO_CLIPBOARD: '1'
          LNRA_DEBUG: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 *>&1 | Tee-Object -FilePath first.txt
          if (-not (Select-String -Path first.txt -Pattern '^LNRA_RESULT=loaded$' -Quiet)) { exit 1 }
          Start-Sleep -Seconds 12  # Chrome writes its profile files lazily
          $prefs = Get-Content "$env:LNRA_USER_DATA_DIR\Default\Secure Preferences", "$env:LNRA_USER_DATA_DIR\Default\Preferences" -Raw -ErrorAction SilentlyContinue
          $needle = ($env:LNRA_DIR -replace '\\', '\\')
          if (-not (($prefs -join '').ToLower().Contains($needle.ToLower()))) { Write-Host "extension path not in Chrome's profile"; exit 1 }
      - name: Second run updates and reloads it
        shell: powershell
        env:
          LNRA_DIR: ${{ runner.temp }}\LinkedIn-Read-All
          LNRA_USER_DATA_DIR: ${{ runner.temp }}\browser-profile
          LNRA_BROWSER: ${{ matrix.browser }}
          LNRA_NO_CLIPBOARD: '1'
          LNRA_DEBUG: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 *>&1 | Tee-Object -FilePath second.txt
          if (-not (Select-String -Path second.txt -Pattern '^LNRA_RESULT=reloaded$' -Quiet)) { exit 1 }
      # Someone who loaded a copy by hand (here: the folder above) runs the one-liner from Git Bash,
      # the shell Claude Code uses on Windows. It should update that copy in place, not add another.
      - name: Git Bash run adopts the copy that's already loaded
        shell: bash
        env:
          LNRA_USER_DATA_DIR: ${{ runner.temp }}\browser-profile
          LNRA_BROWSER: ${{ matrix.browser }}
          LNRA_NO_CLIPBOARD: '1'
        run: |
          bash ./install.sh 2>&1 | tee third.txt
          grep -q 'Updating that copy' third.txt
          grep -qx 'LNRA_RESULT=reloaded' <(tr -d '\r' < third.txt)
          test ! -e "$USERPROFILE/LinkedIn-Read-All"
      - name: Screenshot on failure
        if: failure()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $r = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $r.Width, $r.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.Location, [System.Drawing.Point]::Empty, $r.Size)
          $bmp.Save("$PWD\screen.png")
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-install-debug-${{ matrix.browser }}
          path: |
            screen.png
            first.txt
            second.txt
            third.txt

  # TEMPORARY: find out where Aside installs on Windows (paths, process, profile).
  aside-probe:
    runs-on: windows-latest
    steps:
      - name: Install Aside and look around
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $page = (Invoke-WebRequest 'https://aside.com/download?os=win' -UseBasicParsing).Content
          $url = [regex]::Match($page, 'https://releases\.aside\.com/[^"\\]*win-x64\.exe').Value
          Write-Host "installer: $url"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\aside.exe" -UseBasicParsing
          $p = Start-Process "$env:RUNNER_TEMP\aside.exe" -ArgumentList '--silent' -PassThru
          if (-not $p.WaitForExit(240000)) { Write-Host 'installer still running after 4 min' }
          Start-Sleep 20
          Write-Host '--- processes'
          Get-Process | Where-Object { $_.Path -and $_.Path -notlike 'C:\Windows\*' -and $_.Path -notlike '*\hostedtoolcache\*' } | Select-Object -Unique Name, Path | Format-Table -AutoSize | Out-String -Width 300
          Write-Host '--- App Paths / Uninstall'
          Get-ChildItem 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match 'aside' } | ForEach-Object { "$($_.Name) = $((Get-ItemProperty $_.PSPath).'(default)')" }
          Get-ChildItem 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -match 'aside' } | Format-List DisplayName, InstallLocation, DisplayIcon, UninstallString | Out-String -Width 300
          Write-Host '--- folders'
          foreach ($root in "$env:LOCALAPPDATA", "$env:APPDATA", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") {
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'aside' } | ForEach-Object { $_.FullName; Get-ChildItem $_.FullName -Recurse -Depth 2 -ErrorAction SilentlyContinue | Where-Object { $_.Extension -eq '.exe' -or $_.Name -match 'User Data|Preferences' } | ForEach-Object { '   ' + $_.FullName } }
          }
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'aside' } | ForEach-Object { $_.FullName; Get-ChildItem $_.FullName -Filter *.exe -Recurse -Depth 2 | ForEach-Object { '   ' + $_.FullName } }
          Write-Host '--- shortcuts'
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu", "$env:ProgramData\Microsoft\Windows\Start Menu", "$env:USERPROFILE\Desktop" -Recurse -Filter '*.lnk' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'aside' } | ForEach-Object { $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($_.FullName); "$($_.FullName) -> $($sh.TargetPath) $($sh.Arguments)" }
      - name: Screenshot
        if: always()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $r = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $r.Width, $r.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.Location, [System.Drawing.Point]::Empty, $r.Size)
          $bmp.Save("$PWD\aside.png")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aside-probe
          path: aside.png
