name: Release

# Push a tag like v0.1.1 (matching extension/manifest.json) to test, package and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Tag must match manifest version
        run: |
          v="v$(node -p "require('./extension/manifest.json').version")"
          test "$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest $v"; exit 1; }
      - run: bash -n install.sh
      - run: bash scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Install or update. macOS / Linux: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash\` Windows: \`powershell -NoProfile -ExecutionPolicy Bypass -Command \"irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex\"\`"
